name: Verify preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shopify-plans-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.10.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: shopify/app
      - run: node tools/check-shopify.mjs
      - run: python -m pip install -r tools/browser-requirements.txt
      - run: python -m playwright install --with-deps chrome
      - name: Check authenticated plan screen and PDF downloads
        run: |
          node tools/serve-plans-fixture.mjs > /tmp/fullbleed-plans.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if rg -q 'Synthetic plans browser fixture ready' /tmp/fullbleed-plans.log; then break; fi
            if ! kill -0 "$fixture_pid" 2>/dev/null; then cat /tmp/fullbleed-plans.log; exit 1; fi
            sleep 1
          done
          python tools/check-plans-browser.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: shopify-plan-verification
          path: |
            output/browser/shopify-plans-*
            output/shopify/
          retention-days: 14
  pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.10.0
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: python -m pip install pypdf==6.1.1
      - run: node --report-on-fatalerror --report-uncaught-exception --report-exclude-env --report-exclude-network --report-directory=output/pagination tools/render-pagination.mjs
      - run: python tools/check-pagination.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: pagination-verification
          path: output/pagination/
          retention-days: 14
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPT_OUT_INSTRUMENTATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shopify/app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run setup:playground
      - run: npm run build
      - run: npm test
      - run: npm run examples
      - run: npm run pack
      - run: node tools/build-playground.mjs --check
      - run: node tools/check-playground.mjs
      - run: node tools/check-automation.mjs --hpos
      - run: node tools/check-automation.mjs
      - run: node tools/check-customer-downloads.mjs --hpos --packages
      - run: node tools/check-customer-downloads.mjs --packages
      - run: npm ci --ignore-scripts
        working-directory: shopify/app
      - run: node tools/check-shopify.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: preview-verification
          path: |
            dist/
            output/examples/
            output/templates/
            output/automation/
            output/playground/local-verification.json
            output/shopify/*.json
            output/shopify/*.log
            output/shopify/flow/
          retention-days: 14
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:playground
      - run: npm run build
      - run: npm run pack
      - run: node tools/check-upgrade.mjs --hpos
      - run: node tools/check-upgrade.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: upgrade-verification
          path: output/upgrade/
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.10.0
      - run: docker build -f shopify/app/Dockerfile -t fullbleed-commerce:check .
      - run: node tools/check-container.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-verification
          path: output/container/
          retention-days: 14
  renderer-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:playground
      - run: npm run build
      - run: npm run pack
      - run: node tools/check-renderer-deployment.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: renderer-deployment-verification
          path: output/renderer-deployment/
          retention-days: 14

# Attended staging for the existing synthetic-store app. Deploy with --config staging.
client_id = "91ba2420b9c9d87e00dab059b51eb005"
name = "Fullbleed Commerce"
application_url = "https://shopify-app-production-346e.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_orders"

[auth]
redirect_urls = ["https://shopify-app-production-346e.up.railway.app/auth/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
uri = "/webhooks/app/uninstalled"
topics = ["app/uninstalled"]

[[webhooks.subscriptions]]
uri = "/webhooks/app/scopes_update"
topics = ["app/scopes_update"]

[[webhooks.subscriptions]]
uri = "/webhooks/privacy"
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

[build]
automatically_update_urls_on_dev = false

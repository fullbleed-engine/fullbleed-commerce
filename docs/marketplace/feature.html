<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fullbleed Commerce feature image</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; }
  body { background: #164d46; color: #faf7ef; font-family: Arial, sans-serif; }
  main { position: relative; width: 1600px; height: 900px; }
  .brand { position: absolute; left: 88px; top: 65px; display: flex; align-items: center; gap: 20px; font-size: 27px; font-weight: 650; letter-spacing: -.6px; }
  .brand img { width: 65px; height: 65px; }
  h1 { position: absolute; left: 90px; top: 250px; margin: 0; width: 620px; font-size: 88px; line-height: 1.05; font-weight: 600; letter-spacing: -5px; }
  .detail { position: absolute; left: 94px; top: 565px; width: 530px; font-size: 28px; line-height: 1.45; color: #d6e5dc; }
  .rule { display: block; width: 72px; height: 6px; background: #dd9879; margin-bottom: 26px; }
  .paper { position: absolute; width: 490px; height: auto; box-shadow: 0 18px 40px #08292155; }
  .back { left: 773px; top: 130px; transform: rotate(-7deg); }
  .front { left: 1006px; top: 71px; transform: rotate(4deg); }
  .caption { position: absolute; right: 101px; bottom: 34px; font-size: 15px; color: #d6e5dc; }
</style>
<main>
  <div class="brand"><img src="app-icon.svg" alt="">Fullbleed Commerce</div>
  <h1>Your brand.<br>Every order.</h1>
  <div class="detail"><span class="rule"></span>Design your PDFs.<br>Let Flow prepare the links.</div>
  <img class="paper back" src="../previews/custom-packing-slip.png" alt="A customized packing slip generated by Fullbleed">
  <img class="paper front" src="../previews/contrast-order-summary.png" alt="Fullbleed's Contrast order summary design">
  <div class="caption">Generated PDFs · Fictional sample data</div>
</main>
</html>
